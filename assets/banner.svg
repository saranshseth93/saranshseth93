<svg fill="none" viewBox="0 0 900 320" width="900" height="320" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .banner {
          width: 900px;
          height: 320px;
          background: #0a0e17;
          position: relative;
          overflow: hidden;
          font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
          border-radius: 12px;
        }

        .corner { position: absolute; border-style: solid; width: 24px; height: 24px; }
        .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-color: #F4C430; opacity: 0.5; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-color: #2DD4BF; opacity: 0.5; }

        .grid {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          background-image: radial-gradient(circle, #1a1f2e 1px, transparent 1px);
          background-size: 30px 30px;
          opacity: 0.4;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(50px); }
        .orb-1 { width: 160px; height: 160px; background: #F4C430; top: -20px; right: 100px; opacity: 0; animation: glow 6s ease-in-out infinite; }
        .orb-2 { width: 100px; height: 100px; background: #2DD4BF; bottom: -10px; left: 40px; opacity: 0; animation: glow 6s ease-in-out 2s infinite; }
        .orb-3 { width: 80px; height: 80px; background: #F28C28; top: 40px; left: 350px; opacity: 0; animation: glow 6s ease-in-out 4s infinite; }
        @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 0.12; } }

        .scanline {
          position: absolute; width: 100%; height: 3px; left: 0; top: -10%;
          background: linear-gradient(180deg, transparent, rgba(244,196,48,0.06), transparent);
          animation: scan 5s linear infinite; z-index: 5;
        }
        @keyframes scan { 0% { top: -5%; } 100% { top: 105%; } }

        .content { position: relative; z-index: 2; display: flex; height: 100%; }

        .left {
          flex: 1; display: flex; flex-direction: column; justify-content: center;
          padding: 44px 0 44px 56px;
        }

        .right {
          width: 220px; display: flex; align-items: center; justify-content: center;
          opacity: 0; animation: fade-in 1.2s ease-out 0.8s forwards;
        }

        /* Name row — flex container for alignment */
        .name-row {
          display: flex;
          align-items: center;
          height: 40px;
          opacity: 0; animation: slide-in 0.7s ease-out 0.2s forwards;
        }

        .name {
          font-size: 34px; font-weight: 900; color: #F4C430;
          letter-spacing: 5px; text-transform: uppercase;
          text-shadow: 0 0 20px rgba(244,196,48,0.2);
          line-height: 1;
        }

        .cursor-block {
          width: 4px; height: 34px; background: #F4C430;
          margin-left: 10px; flex-shrink: 0;
          animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .role {
          font-size: 14px; font-weight: 700; color: #e6edf3;
          letter-spacing: 4px; text-transform: uppercase; margin-top: 8px;
          text-shadow: 0 0 12px rgba(230,237,243,0.1);
          opacity: 0; animation: slide-in 0.7s ease-out 0.45s forwards;
        }

        .line {
          width: 200px; height: 1px; margin: 24px 0;
          background: linear-gradient(90deg, #F4C430, transparent);
          opacity: 0; animation: slide-in 0.7s ease-out 0.6s forwards;
        }

        .tags {
          display: flex; flex-wrap: wrap; gap: 8px;
          opacity: 0; animation: slide-in 0.7s ease-out 0.75s forwards;
        }

        .tag {
          font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
          padding: 5px 14px;
          background: rgba(22, 27, 40, 0.9);
          border: 1px solid #252b3b;
          position: relative;
        }
        .tag::before {
          content: ''; position: absolute; top: -1px; left: -1px;
          width: 4px; height: 4px;
          background: #0a0e17; border-bottom: 1px solid #252b3b; border-right: 1px solid #252b3b;
        }
        .tag::after {
          content: ''; position: absolute; bottom: -1px; right: -1px;
          width: 4px; height: 4px;
          background: #0a0e17; border-top: 1px solid #252b3b; border-left: 1px solid #252b3b;
        }

        .tag-gold { color: #F4C430; border-color: rgba(244,196,48,0.4); text-shadow: 0 0 8px rgba(244,196,48,0.15); }
        .tag-gold::before { border-color: rgba(244,196,48,0.4); }
        .tag-gold::after { border-color: rgba(244,196,48,0.4); }

        .tag-teal { color: #5EEAD4; border-color: rgba(45,212,191,0.4); text-shadow: 0 0 8px rgba(45,212,191,0.15); }
        .tag-teal::before { border-color: rgba(45,212,191,0.4); }
        .tag-teal::after { border-color: rgba(45,212,191,0.4); }

        .tag-prefix { opacity: 0.6; margin-right: 4px; }

        @keyframes slide-in {
          from { opacity: 0; transform: translateY(14px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in { to { opacity: 1; } }

        .gamepad { position: relative; width: 140px; height: 100px; }
        .p { position: absolute; }
      </style>

      <div class="banner">
        <div class="grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="scanline"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <div class="content">
          <div class="left">
            <div class="name-row">
              <span class="name">Saransh Seth</span>
              <div class="cursor-block"></div>
            </div>
            <div class="role">Senior Software Engineer</div>
            <div class="line"></div>
            <div class="tags">
              <span class="tag tag-gold"><span class="tag-prefix">▸</span> Design Systems</span>
              <span class="tag tag-gold"><span class="tag-prefix">▸</span> Vue 3 + TS</span>
              <span class="tag tag-gold"><span class="tag-prefix">▸</span> AI Workflows</span>
              <span class="tag tag-teal"><span class="tag-prefix">◆</span> Intrepid Travel</span>
              <span class="tag tag-teal"><span class="tag-prefix">◆</span> Melbourne</span>
              <span class="tag tag-teal"><span class="tag-prefix">◆</span> pixelpundit.dev</span>
            </div>
          </div>

          <div class="right">
            <div class="gamepad">
              <div class="p" style="left:14px; top:21px; width:112px; height:56px; background:#1e2538; border-radius:6px;"></div>
              <div class="p" style="left:21px; top:14px; width:98px; height:63px; background:#252d42; border-radius:8px;"></div>
              <div class="p" style="left:7px; top:42px; width:28px; height:42px; background:#1e2538; border-radius:0 0 10px 10px;"></div>
              <div class="p" style="left:105px; top:42px; width:28px; height:42px; background:#1e2538; border-radius:0 0 10px 10px;"></div>
              <div class="p" style="left:28px; top:35px; width:7px; height:21px; background:#2DD4BF; border-radius:1px;"></div>
              <div class="p" style="left:21px; top:42px; width:21px; height:7px; background:#2DD4BF; border-radius:1px;"></div>
              <div class="p" style="left:98px; top:35px; width:10px; height:10px; background:#F4C430; border-radius:50%;"></div>
              <div class="p" style="left:112px; top:42px; width:10px; height:10px; background:#F28C28; border-radius:50%;"></div>
              <div class="p" style="left:56px; top:56px; width:12px; height:5px; background:#3d4663; border-radius:2px;"></div>
              <div class="p" style="left:72px; top:56px; width:12px; height:5px; background:#3d4663; border-radius:2px;"></div>
              <div class="p" style="left:49px; top:21px; width:42px; height:24px; background:#0a0e17; border-radius:3px; border:1px solid rgba(45,212,191,0.2);"></div>
              <div class="p" style="left:56px; top:27px; width:3px; height:12px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:56px; top:27px; width:9px; height:3px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:62px; top:27px; width:3px; height:6px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:56px; top:33px; width:6px; height:3px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:70px; top:27px; width:3px; height:12px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:70px; top:27px; width:9px; height:3px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:76px; top:27px; width:3px; height:6px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:70px; top:33px; width:6px; height:3px; background:#F4C430; opacity:0.8;"></div>
              <div class="p" style="left:28px; top:14px; width:21px; height:5px; background:#2DD4BF; border-radius:3px 3px 0 0; opacity:0.5;"></div>
              <div class="p" style="left:91px; top:14px; width:21px; height:5px; background:#F4C430; border-radius:3px 3px 0 0; opacity:0.5;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
